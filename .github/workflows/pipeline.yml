name: Pipeline

on:
  push:
    branches: [main, master, develop]
    tags: ['v*']
  pull_request:
    branches: [main, master]

env:
  GO_VERSION: '1.25'
  AWS_REGION: ap-south-1
  ECR_REPOSITORY: self-healing-cache
  ECR_REGISTRY: 522412052856.dkr.ecr.ap-south-1.amazonaws.com

permissions:
  contents: read
  id-token: write  # Required for OIDC

jobs:
  # ==========================================
  # STAGE 1: Lint & Static Analysis
  # ==========================================
  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}

      - name: Check formatting
        run: |
          gofmt -l .
          if [ -n "$(gofmt -l .)" ]; then
            echo "The following files need formatting:"
            gofmt -l .
            exit 1
          fi

      - name: Run go vet
        run: go vet ./...

  # ==========================================
  # STAGE 2: Unit Tests (Multi-Platform)
  # ==========================================
  test:
    name: Test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    needs: lint
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
      fail-fast: false

    steps:
      - uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}

      - name: Cache Go modules
        uses: actions/cache@v4
        with:
          path: ~/go/pkg/mod
          key: ${{ runner.os }}-go-${{ hashFiles('**/go.sum') }}
          restore-keys: |
            ${{ runner.os }}-go-

      - name: Download dependencies
        run: go mod download

      - name: Run unit tests
        run: go test ./internal/... -v -timeout 120s

      - name: Run tests with coverage
        if: matrix.os == 'ubuntu-latest'
        run: go test ./internal/... -coverprofile=coverage.out -timeout 120s

      - name: Upload coverage
        if: matrix.os == 'ubuntu-latest'
        uses: actions/upload-artifact@v4
        with:
          name: coverage
          path: coverage.out

  # ==========================================
  # STAGE 3: Integration & Stress Tests
  # ==========================================
  integration-test:
    name: Integration & Stress Tests
    runs-on: ubuntu-latest
    needs: test

    steps:
      - uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}

      - name: Cache Go modules
        uses: actions/cache@v4
        with:
          path: ~/go/pkg/mod
          key: ${{ runner.os }}-go-${{ hashFiles('**/go.sum') }}
          restore-keys: |
            ${{ runner.os }}-go-

      - name: Download dependencies
        run: go mod download

      - name: Run integration tests
        run: go test ./audit/ -v -timeout 180s

      - name: Run store stress tests
        run: go test ./internal/store/ -run "TestConcurrent|TestHighContention|TestMemoryLeak" -v -timeout 120s

      - name: Run failure scenario tests
        run: go test ./internal/server/ -run "TestMultiple|TestRapid|TestFailoverUnder|TestNetwork" -v -timeout 120s

      - name: Run chaos tests
        run: go test ./internal/chaos/ -v -timeout 120s

  # ==========================================
  # STAGE 4: Build Binaries
  # ==========================================
  build:
    name: Build (${{ matrix.os }}-${{ matrix.arch }})
    runs-on: ubuntu-latest
    needs: integration-test
    if: github.event_name == 'push'
    strategy:
      matrix:
        include:
          - os: linux
            arch: amd64
          - os: linux
            arch: arm64
          - os: darwin
            arch: amd64
          - os: darwin
            arch: arm64
          - os: windows
            arch: amd64

    steps:
      - uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}

      - name: Build server binary
        env:
          GOOS: ${{ matrix.os }}
          GOARCH: ${{ matrix.arch }}
        run: |
          output_name="cache-server-${{ matrix.os }}-${{ matrix.arch }}"
          if [ "${{ matrix.os }}" = "windows" ]; then
            output_name="${output_name}.exe"
          fi
          go build -o "dist/${output_name}" ./cmd/cache/

      - name: Build client binary
        env:
          GOOS: ${{ matrix.os }}
          GOARCH: ${{ matrix.arch }}
        run: |
          output_name="cache-client-${{ matrix.os }}-${{ matrix.arch }}"
          if [ "${{ matrix.os }}" = "windows" ]; then
            output_name="${output_name}.exe"
          fi
          go build -o "dist/${output_name}" ./cmd/cache-client/

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: binaries-${{ matrix.os }}-${{ matrix.arch }}
          path: dist/

  # ==========================================
  # STAGE 5: Build & Push Docker Image
  # ==========================================
  docker:
    name: Docker Build & Push
    runs-on: ubuntu-latest
    needs: [build]
    if: github.event_name == 'push' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master')
    permissions:
      contents: read
      id-token: write
    outputs:
      image_tag: ${{ steps.meta.outputs.tags }}

    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      # ==========================================
      # OIDC trust requirement (fixed 2026-09-05):
      # "Not authorized to perform sts:AssumeRoleWithWebIdentity" means the
      # role's trust policy `sub` doesn't match the token GitHub mints.
      # This repo was created AFTER 2026-07-15, so GitHub issues IMMUTABLE
      # subject claims that embed numeric IDs (CloudTrail + gh api confirmed):
      #   repo:NobleChicken97@141447050/self-healing-distributed-cache@1357349698:ref:refs/heads/master
      # The dedicated role `shdc-github-actions-ecr` (deploy/github_oidc_shdc.tf)
      # trusts the immutable pattern below. Do NOT point AWS_ROLE_ARN at the
      # legacy-format shared roles (GitHubActionsECRPush/github-actions-ecr-role)
      # used by older, pre-cutoff projects — their trust won't match this repo.
      # {
      #   "Version": "2012-10-17",
      #   "Statement": [
      #     {
      #       "Effect": "Allow",
      #       "Principal": {
      #         "Federated": "arn:aws:iam::522412052856:oidc-provider/token.actions.githubusercontent.com"
      #       },
      #       "Action": "sts:AssumeRoleWithWebIdentity",
      #       "Condition": {
      #         "StringEquals": {
      #           "token.actions.githubusercontent.com:aud": "sts.amazonaws.com"
      #         },
      #         "StringLike": {
      #           "token.actions.githubusercontent.com:sub": "repo:NobleChicken97@141447050/self-healing-distributed-cache@1357349698:*"
      #         }
      #       }
      #     }
      #   ]
      # }
      # ==========================================
      - name: Configure AWS credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Login to Amazon ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.ECR_REGISTRY }}/${{ env.ECR_REPOSITORY }}
          # NOTE: `format=long` is required — the deploy job pulls
          # `sha-${{ github.sha }}` (full 40-char SHA). The default short
          # format (`sha-xxxxxxx`) would never match and `docker pull` fails.
          tags: |
            type=sha,format=long
            type=ref,event=tag
            type=raw,value=latest

      - name: Build and push Docker image
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # ==========================================
  # STAGE 6: Deploy to Lightsail (Rolling)
  # ==========================================
  deploy:
    name: Deploy to Lightsail
    runs-on: ubuntu-latest
    needs: [docker]
    if: github.event_name == 'push' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master')
    permissions:
      contents: read
      id-token: write

    steps:
      - uses: actions/checkout@v4

      - name: Configure AWS credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      # Runner-side ECR token (2026-09-05): Lightsail nodes use the shared
      # AmazonLightsailInstanceRole, which has no ECR rights (and we must not
      # touch that shared role — other projects' instances use it). So the
      # runner mints the 12h login token with its OIDC creds and passes it
      # over SSH. Nodes never need AWS ECR permissions of their own.
      - name: Get ECR login token (runner-side, OIDC creds)
        id: ecr-token
        run: |
          TOKEN=$(aws ecr get-login-password --region "${{ env.AWS_REGION }}")
          echo "::add-mask::$TOKEN"
          echo "token=$TOKEN" >> "$GITHUB_OUTPUT"

      # Rolling deployment: one node at a time with health checks
      - name: Deploy to Node 1
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.LIGHTSAIL_NODE1_IP }}
          username: admin
          key: ${{ secrets.LIGHTSAIL_SSH_KEY }}
          script: |
            echo "${{ steps.ecr-token.outputs.token }}" | docker login --username AWS --password-stdin ${{ env.ECR_REGISTRY }}
            docker pull ${{ env.ECR_REGISTRY }}/${{ env.ECR_REPOSITORY }}:sha-${{ github.sha }}
            docker stop cache-server || true
            docker rm cache-server || true
            # NOTE: --network host is deliberate. memberlist SWIM matches inbound
            # UDP probes by source address; Docker bridge port-mapping rewrites
            # UDP sources, so probes never match and nodes stay mutually suspect.
            # Host networking removes the NAT path for both TCP and UDP.
            docker run -d \
              --name cache-server \
              --restart always \
              --network host \
              ${{ env.ECR_REGISTRY }}/${{ env.ECR_REPOSITORY }}:sha-${{ github.sha }} \
              -addr :8080 \
              -cluster-port 7946 \
              -gossip-advertise-addr ${{ secrets.LIGHTSAIL_NODE1_IP }} \
              -id node-1 \
              -peers "${{ secrets.LIGHTSAIL_NODE2_IP }}:8080,${{ secrets.LIGHTSAIL_NODE3_IP }}:8080"

      - name: Wait for Node 1 to be healthy
        run: |
          for i in {1..30}; do
            if curl -sf http://${{ secrets.LIGHTSAIL_NODE1_IP }}:8080/health > /dev/null 2>&1; then
              echo "Node 1 is healthy"
              exit 0
            fi
            echo "Waiting for node 1... (attempt $i/30)"
            sleep 2
          done
          echo "Node 1 failed health check"
          exit 1

      - name: Deploy to Node 2
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.LIGHTSAIL_NODE2_IP }}
          username: admin
          key: ${{ secrets.LIGHTSAIL_SSH_KEY }}
          script: |
            echo "${{ steps.ecr-token.outputs.token }}" | docker login --username AWS --password-stdin ${{ env.ECR_REGISTRY }}
            docker pull ${{ env.ECR_REGISTRY }}/${{ env.ECR_REPOSITORY }}:sha-${{ github.sha }}
            docker stop cache-server || true
            docker rm cache-server || true
            docker run -d \
              --name cache-server \
              --restart always \
              --network host \
              ${{ env.ECR_REGISTRY }}/${{ env.ECR_REPOSITORY }}:sha-${{ github.sha }} \
              -addr :8080 \
              -cluster-port 7946 \
              -gossip-advertise-addr ${{ secrets.LIGHTSAIL_NODE2_IP }} \
              -id node-2 \
              -peers "${{ secrets.LIGHTSAIL_NODE1_IP }}:8080,${{ secrets.LIGHTSAIL_NODE3_IP }}:8080"

      - name: Wait for Node 2 to be healthy
        run: |
          for i in {1..30}; do
            if curl -sf http://${{ secrets.LIGHTSAIL_NODE2_IP }}:8080/health > /dev/null 2>&1; then
              echo "Node 2 is healthy"
              exit 0
            fi
            echo "Waiting for node 2... (attempt $i/30)"
            sleep 2
          done
          echo "Node 2 failed health check"
          exit 1

      - name: Deploy to Node 3
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.LIGHTSAIL_NODE3_IP }}
          username: admin
          key: ${{ secrets.LIGHTSAIL_SSH_KEY }}
          script: |
            echo "${{ steps.ecr-token.outputs.token }}" | docker login --username AWS --password-stdin ${{ env.ECR_REGISTRY }}
            docker pull ${{ env.ECR_REGISTRY }}/${{ env.ECR_REPOSITORY }}:sha-${{ github.sha }}
            docker stop cache-server || true
            docker rm cache-server || true
            docker run -d \
              --name cache-server \
              --restart always \
              --network host \
              ${{ env.ECR_REGISTRY }}/${{ env.ECR_REPOSITORY }}:sha-${{ github.sha }} \
              -addr :8080 \
              -cluster-port 7946 \
              -gossip-advertise-addr ${{ secrets.LIGHTSAIL_NODE3_IP }} \
              -id node-3 \
              -peers "${{ secrets.LIGHTSAIL_NODE1_IP }}:8080,${{ secrets.LIGHTSAIL_NODE2_IP }}:8080"

      - name: Wait for Node 3 to be healthy
        run: |
          for i in {1..30}; do
            if curl -sf http://${{ secrets.LIGHTSAIL_NODE3_IP }}:8080/health > /dev/null 2>&1; then
              echo "Node 3 is healthy"
              exit 0
            fi
            echo "Waiting for node 3... (attempt $i/30)"
            sleep 2
          done
          echo "Node 3 failed health check"
          exit 1

      # ==========================================
      # STAGE 7: Post-Deploy Smoke Tests
      # ==========================================
      - name: Verify full cluster health
        run: |
          sleep 10
          echo "=== Verifying Cluster Health ==="
          
          # Check all nodes are healthy
          for node in "node1:${{ secrets.LIGHTSAIL_NODE1_IP }}" "node2:${{ secrets.LIGHTSAIL_NODE2_IP }}" "node3:${{ secrets.LIGHTSAIL_NODE3_IP }}"; do
            IFS=':' read -r name ip <<< "$node"
            echo "Checking $name ($ip)..."
            curl -sf "http://${ip}:8080/health" || { echo "Health check failed for $name"; exit 1; }
            curl -sf "http://${ip}:8080/ring/info" || { echo "Ring info failed for $name"; exit 1; }
          done
          
          # Verify cluster membership
          echo "Verifying cluster membership..."
          for ip in "${{ secrets.LIGHTSAIL_NODE1_IP }}" "${{ secrets.LIGHTSAIL_NODE2_IP }}" "${{ secrets.LIGHTSAIL_NODE3_IP }}"; do
            ALIVE_COUNT=$(curl -sf "http://${ip}:8080/cluster/info" | jq -r '.alive_count // 0')
            if [ "$ALIVE_COUNT" -lt 2 ]; then
              echo "Node $ip only sees $ALIVE_COUNT alive nodes (expected at least 2)"
              exit 1
            fi
            echo "Node $ip sees $ALIVE_COUNT alive nodes"
          done

      - name: Smoke test - CRUD operations
        run: |
          echo "=== Smoke Test: CRUD Operations ==="
          
          NODE1_IP="${{ secrets.LIGHTSAIL_NODE1_IP }}"
          NODE2_IP="${{ secrets.LIGHTSAIL_NODE2_IP }}"
          
          # Write test
          WRITE_RESP=$(curl -sf -X POST "http://${NODE1_IP}:8080/set" \
            -H "Content-Type: application/json" \
            -d '{"key":"deploy-test-key","value":"deploy-test-value","ttl_ms":60000}')
          echo "Write: $WRITE_RESP"
          
          # Wait for replication
          sleep 3
          
          # Read from different node
          READ_RESP=$(curl -sf "http://${NODE2_IP}:8080/get?key=deploy-test-key")
          echo "Read from node 2: $READ_RESP"
          
          if ! echo "$READ_RESP" | grep -q "deploy-test-value"; then
            echo "Value not replicated to node 2"
            exit 1
          fi
          
          echo "✅ CRUD operations verified"

      - name: Smoke test - Performance baseline
        run: |
          echo "=== Smoke Test: Performance ==="
          
          NODE1_IP="${{ secrets.LIGHTSAIL_NODE1_IP }}"
          START_TIME=$(date +%s%N)
          
          for i in {1..50}; do
            curl -sf -X POST "http://${NODE1_IP}:8080/set" \
              -H "Content-Type: application/json" \
              -d "{\"key\":\"perf-$i\",\"value\":\"val-$i\",\"ttl_ms\":30000}" > /dev/null
          done
          
          END_TIME=$(date +%s%N)
          DURATION_MS=$(( (END_TIME - START_TIME) / 1000000 ))
          AVG_LATENCY=$((DURATION_MS / 50))
          
          echo "50 writes in ${DURATION_MS}ms (avg: ${AVG_LATENCY}ms per write)"
          
          if [ "$AVG_LATENCY" -gt 100 ]; then
            echo "Warning: Average latency ${AVG_LATENCY}ms exceeds 100ms threshold"
          fi
          
          echo "✅ Performance baseline verified"

      - name: Deployment summary
        run: |
          echo "=== Deployment Complete ==="
          echo "✅ All nodes deployed and healthy"
          echo "✅ Cluster membership verified"
          echo "✅ CRUD operations working"
          echo "✅ Performance baseline acceptable"

  # ==========================================
  # STAGE 8: GitHub Release (on tags only)
  # ==========================================
  release:
    name: Release
    runs-on: ubuntu-latest
    needs: [deploy]
    if: startsWith(github.ref, 'refs/tags/v')
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}

      - name: Download build artifacts
        uses: actions/download-artifact@v4
        with:
          path: dist/
          merge-multiple: true

      - name: Create release archives
        run: |
          mkdir -p release
          cd dist
          for binary in cache-server-*; do
            if [[ "$binary" == *.exe ]]; then
              zip "../release/${binary%.exe}.zip" "$binary"
            else
              tar -czf "../release/${binary}.tar.gz" "$binary"
            fi
          done
          for binary in cache-client-*; do
            if [[ "$binary" == *.exe ]]; then
              zip "../release/${binary%.exe}.zip" "$binary"
            else
              tar -czf "../release/${binary}.tar.gz" "$binary"
            fi
          done

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v1
        with:
          files: release/*.tar.gz,release/*.zip
          draft: false
          prerelease: false
          generate_release_notes: true
