name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  release:
    name: Create Release
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.25'

      - name: Build release binaries
        run: |
          mkdir -p release

          # Linux AMD64
          GOOS=linux GOARCH=amd64 go build -o release/cache-server-linux-amd64 ./cmd/cache/
          GOOS=linux GOARCH=amd64 go build -o release/cache-client-linux-amd64 ./cmd/cache-client/

          # Linux ARM64
          GOOS=linux GOARCH=arm64 go build -o release/cache-server-linux-arm64 ./cmd/cache/
          GOOS=linux GOARCH=arm64 go build -o release/cache-client-linux-arm64 ./cmd/cache-client/

          # macOS AMD64
          GOOS=darwin GOARCH=amd64 go build -o release/cache-server-darwin-amd64 ./cmd/cache/
          GOOS=darwin GOARCH=amd64 go build -o release/cache-client-darwin-amd64 ./cmd/cache-client/

          # macOS ARM64 (Apple Silicon)
          GOOS=darwin GOARCH=arm64 go build -o release/cache-server-darwin-arm64 ./cmd/cache/
          GOOS=darwin GOARCH=arm64 go build -o release/cache-client-darwin-arm64 ./cmd/cache-client/

          # Windows AMD64
          GOOS=windows GOARCH=amd64 go build -o release/cache-server-windows-amd64.exe ./cmd/cache/
          GOOS=windows GOARCH=amd64 go build -o release/cache-client-windows-amd64.exe ./cmd/cache-client/

      - name: Create archives
        run: |
          cd release
          for binary in cache-server-*; do
            if [[ "$binary" == *.exe ]]; then
              zip "${binary%.exe}.zip" "$binary"
            else
              tar -czf "${binary}.tar.gz" "$binary"
            fi
          done
          for binary in cache-client-*; do
            if [[ "$binary" == *.exe ]]; then
              zip "${binary%.exe}.zip" "$binary"
            else
              tar -czf "${binary}.tar.gz" "$binary"
            fi
          done

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v1
        with:
          files: release/*.tar.gz,release/*.zip
          draft: false
          prerelease: false
          generate_release_notes: true

  docker-release:
    name: Docker Release
    runs-on: ubuntu-latest
    needs: release

    steps:
      - uses: actions/checkout@v4

      - name: Docker meta
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: |
            ghcr.io/${{ github.repository }}
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            latest

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push Docker image
        uses: docker/build-push-action@v5
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
