name: CD

on:
  push:
    branches: [ main, master ]
    tags: [ 'v*' ]

env:
  AWS_REGION: ap-south-1
  ECR_REPOSITORY: self-healing-cache

permissions:
  contents: read
  id-token: write  # Required for OIDC

jobs:
  # Build and push Docker image to ECR
  build-and-push:
    name: Build & Push to ECR
    runs-on: ubuntu-latest
    outputs:
      image_tag: ${{ steps.meta.outputs.tags }}

    steps:
      - uses: actions/checkout@v4

      - name: Configure AWS credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Login to Amazon ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Set up Docker Buildx
        uses: docker/build-push-action@v5

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ steps.login-ecr.outputs.registry }}/${{ env.ECR_REPOSITORY }}
          tags: |
            type=sha
            type=ref,event=tag
            type=raw,value=latest

      - name: Build and push Docker image
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # Deploy to Lightsail instances
  deploy:
    name: Deploy to Lightsail
    runs-on: ubuntu-latest
    needs: build-and-push

    steps:
      - uses: actions/checkout@v4

      - name: Configure AWS credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Deploy to Node 1
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.LIGHTSAIL_NODE1_IP }}
          username: admin
          key: ${{ secrets.LIGHTSAIL_SSH_KEY }}
          script: |
            aws ecr get-login-password --region ap-south-1 | docker login --username AWS --password-stdin ${{ secrets.ECR_REGISTRY }}
            docker pull ${{ needs.build-and-push.outputs.image_tag }}
            docker stop cache-server || true
            docker rm cache-server || true
            docker run -d \
              --name cache-server \
              --restart always \
              -p 8080:8080 \
              -p 7946:7946 \
              ${{ needs.build-and-push.outputs.image_tag }} \
              -addr :8080 \
              -id node-1 \
              -peers "${{ secrets.LIGHTSAIL_NODE2_IP }}:8080,${{ secrets.LIGHTSAIL_NODE3_IP }}:8080"

      - name: Deploy to Node 2
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.LIGHTSAIL_NODE2_IP }}
          username: admin
          key: ${{ secrets.LIGHTSAIL_SSH_KEY }}
          script: |
            aws ecr get-login-password --region ap-south-1 | docker login --username AWS --password-stdin ${{ secrets.ECR_REGISTRY }}
            docker pull ${{ needs.build-and-push.outputs.image_tag }}
            docker stop cache-server || true
            docker rm cache-server || true
            docker run -d \
              --name cache-server \
              --restart always \
              -p 8080:8080 \
              -p 7946:7946 \
              ${{ needs.build-and-push.outputs.image_tag }} \
              -addr :8080 \
              -id node-2 \
              -peers "${{ secrets.LIGHTSAIL_NODE1_IP }}:8080,${{ secrets.LIGHTSAIL_NODE3_IP }}:8080"

      - name: Deploy to Node 3
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.LIGHTSAIL_NODE3_IP }}
          username: admin
          key: ${{ secrets.LIGHTSAIL_SSH_KEY }}
          script: |
            aws ecr get-login-password --region ap-south-1 | docker login --username AWS --password-stdin ${{ secrets.ECR_REGISTRY }}
            docker pull ${{ needs.build-and-push.outputs.image_tag }}
            docker stop cache-server || true
            docker rm cache-server || true
            docker run -d \
              --name cache-server \
              --restart always \
              -p 8080:8080 \
              -p 7946:7946 \
              ${{ needs.build-and-push.outputs.image_tag }} \
              -addr :8080 \
              -id node-3 \
              -peers "${{ secrets.LIGHTSAIL_NODE1_IP }}:8080,${{ secrets.LIGHTSAIL_NODE2_IP }}:8080"

      - name: Verify deployment
        run: |
          sleep 10
          curl -f http://${{ secrets.LIGHTSAIL_NODE1_IP }}:8080/ring/info || exit 1
          echo "✅ Deployment verified!"
