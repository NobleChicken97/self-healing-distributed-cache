# Self-Healing Distributed Cache - Local Development Cluster
# Usage:
#   docker-compose up -d          # Start 3-node cluster
#   docker-compose logs -f node-a # View logs
#   docker-compose down           # Stop cluster
#
# Notes:
# - Health is checked externally (curl localhost:808X/health): the scratch
#   image has no shell/wget, so container healthchecks are intentionally absent.
# - /metrics returns JSON (not Prometheus exposition format); scrape it with
#   curl/jq. Native Prometheus support is future work.

services:
  node-a:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: cache-node-a
    # IDs double as ring/gossip identity: every node must use the same
    # "host:port" naming so rings agree and liveness checks match.
    command: ["-addr", ":8080", "-id", "node-a:8080", "-advertise-addr", "node-a:8080", "-cluster-port", "7946", "-gossip-advertise-addr", "node-a"]
    ports:
      - "8080:8080"  # HTTP API
      - "7946:7946"  # Gossip protocol
    networks:
      - cache-net
    restart: unless-stopped

  node-b:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: cache-node-b
    command: ["-addr", ":8080", "-id", "node-b:8080", "-advertise-addr", "node-b:8080", "-peers", "node-a:8080", "-cluster-port", "7946", "-gossip-advertise-addr", "node-b"]
    ports:
      - "8081:8080"  # HTTP API
    depends_on:
      - node-a
    networks:
      - cache-net
    restart: unless-stopped

  node-c:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: cache-node-c
    command: ["-addr", ":8080", "-id", "node-c:8080", "-advertise-addr", "node-c:8080", "-peers", "node-a:8080", "-cluster-port", "7946", "-gossip-advertise-addr", "node-c"]
    ports:
      - "8082:8080"  # HTTP API
    depends_on:
      - node-a
    networks:
      - cache-net
    restart: unless-stopped

networks:
  cache-net:
    driver: bridge
    ipam:
      config:
        - subnet: 172.28.0.0/16
